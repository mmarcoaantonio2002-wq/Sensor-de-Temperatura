<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor de Sensor en Tiempo Real</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; }
    .status-banner { padding: 12px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; margin-top: 15px; transition: background-color 0.3s; }
    .normal { background-color: #e8f5e9; color: #2e7d32; }
    .alarm { background-color: #ffebee; color: #c62828; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    .controls { margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
    input[type="range"] { width: 150px; }
    canvas { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📡 Monitor de Sensor (Demostración)</h2>
    <div class="controls">
      <label for="umbral"><b>Umbral Límite (%):</b> <span id="umbral-val">75</span>%</label>
      <input type="range" id="umbral" min="0" max="100" value="75" />
    </div>
    <div id="status" class="status-banner normal">
      ✅ Estado Normal. Nivel actual: <span id="sensor-val">0</span>%
    </div>
    <canvas id="sensorChart"></canvas>
  </div>
  <script src="app.js"></script>
</body>
</html>
